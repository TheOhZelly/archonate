# archonate's visualizer feed: cava writes one line of bar heights per frame
# ("12;40;...;", 0-100) which Cava.qml reads. Not the terminal cava config.
[general]
bars = 48
framerate = 45
sleep_timer = 4

[input]
method = pipewire
source = auto

[output]
method = raw
channels = mono
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
noise_reduction = 72
monstercat = 1
